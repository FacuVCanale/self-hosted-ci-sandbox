name: ci gate sandbox

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read
  id-token: write

jobs:
  gate:
    uses: FacuVCanale/self-hosted-ci/.github/workflows/ci-gate.yml@5bd277d5a448771738b3eb957f3b50b0757816e8
    with:
      gate_service_url: https://self-hosted-ci-gate-service-staging.facuvcanale-self-hosted-ci-gate-service.workers.dev
      oidc_audience: self-hosted-ci-gate
      runner_pool_id: hosted-default
      repository_id: ${{ github.repository_id }}
      pr_number: ${{ github.event.pull_request.number }}
      head_sha: ${{ github.event.pull_request.head.sha }}
      trusted_command: test -f README.md
